<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Woodlawn NY Car & SUV{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-content">
            <div class="logo">WOODLAWN<span>NY</span></div>
            <ul class="nav-links">
                <li><a href="{{ url_for('index') }}">Home</a></li>
                <li><a href="{{ url_for('booking') }}">Booking</a></li>
                <li><a href="{{ url_for('fleet') }}">Fleet</a></li>
                <li><a href="{{ url_for('services') }}">Services</a></li>
            </ul>
            <div class="nav-actions">
                <a href="tel:+10000000000" class="phone-link"><i class="fas fa-phone"></i> <span>(555) 000-0000</span></a>
                <button class="menu-toggle"><i class="fas fa-bars"></i></button>
            </div>
        </div>
    </nav>

    {% block content %}{% endblock %}

    <footer style="text-align: center; padding: 40px; color: #666; font-size: 0.8rem; background: #0a0a0b;">
        &copy; 2026 Woodlawn NY Car & SUV Service.
    </footer>

    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&libraries=places"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
